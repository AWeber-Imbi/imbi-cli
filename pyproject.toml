[project]
name = "imbi-cli"
version = "0.1.0"
description = "Command-line interface for the Imbi service registry"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = ["httpx>=0.28", "openapi-python-client>=0.29,<0.30"]

[project.scripts]
imbi-cli = "imbi_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imbi_cli"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["PLC0415"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
]
